services:
  - type: web
    name: discord-clone
    env: node
    plan: free
    buildCommand: cd client && npm install && npm run build && cd ../server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: DATABASE_URL
        value: ./chat.db
      - key: JWT_SECRET
        generateValue: true
